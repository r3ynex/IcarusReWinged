plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url = "https://www.cursemaven.com"
	}

	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
	}


}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/icarusrewinged.classtweaker")

	splitEnvironmentSourceSets()

	mods {
		"icarusrewinged" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "curse.maven:icarus-428151:8247927"
	modImplementation "curse.maven:common-network-806044:8357963"
	modImplementation "curse.maven:resourceful-config-714059:6223996"
	modImplementation "curse.maven:sparkweave-911456:6161137"

	modImplementation "curse.maven:trinkets-341284:5534317"

	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def outputJarName = "icarusrewinged-${mod_version}-1.20.1-fabric.jar"

tasks.named('jar', Jar) {
	archiveFileName = outputJarName
}

tasks.named('remapJar') {
	archiveFileName = outputJarName
}

tasks.register('copyToLauncher', Copy) {
	dependsOn remapJar
	from remapJar.archiveFile
	into file("C:/Users/Administrator/AppData/Roaming/PrismLauncher/instances/IcarusRW-1.20.1-Fabric/minecraft/mods")
}

tasks.named('build') {
	finalizedBy 'copyToLauncher'
}